name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check training data changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            changes=$(git diff --name-only "$PR_BASE...$PR_HEAD" -- training_data.csv)
          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            changes=$(git ls-files -- training_data.csv)
          else
            changes=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- training_data.csv)
          fi

          if [ -n "$changes" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.changes.outputs.changed == 'true'
        with:
          python-version: '3.12'
      - name: Train linear model
        if: steps.changes.outputs.changed == 'true'
        run: |
          python -m pip install -r requirements.txt
          python train_model.py
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.changed == 'true' && github.event_name == 'push'
        with:
          name: linear-model
          path: linear_model.txt
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && needs.train.outputs.changed == 'true'
    needs: train
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release
      - uses: actions/download-artifact@v4
        with:
          name: linear-model
      - name: Commit and push model
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linear_model.txt
          git commit --allow-empty -m "Generate model for run $GITHUB_RUN_NUMBER"
          git push origin HEAD:release
      - name: Publish model on GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$GITHUB_RUN_NUMBER"
          gh release create "$tag" linear_model.txt \
            --target "$(git rev-parse HEAD)" \
            --title "Release $tag" \
            --notes "Automated release generated by CI/CD pipeline."
